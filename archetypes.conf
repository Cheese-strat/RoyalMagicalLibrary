# RML's corrections to strings.conf's archetype names.
# A code with any line here takes its names from here instead of strings.conf: one name a line, as card text writes it.
# strings.conf: "Polymerization/Fusion"
!setname 0x46 Polymerization
!setname 0x46 Fusion
# strings.conf: "True Draco" only
!setname 0xf9 True Draco
!setname 0xf9 True King
# strings.conf: "code Talker"
!setname 0x101 Code Talker
# strings.conf: "Angelechgy"
!setname 0x1e2 Angelechy
# strings.conf: "Sennet"
!setname 0x1eb Zenet
